<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111722" />
    <title>Philosopher Chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- App shell -->
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar">
        <header class="sidebar-header">
          <span class="app-title"
            ><span class="app-mark" aria-hidden="true">🏛️</span>Philosopher
            Chat</span
          >
          <button
            id="new-thread-btn"
            class="btn btn-primary btn-small btn-pill new-thread-btn"
            title="New conversation"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
            New
          </button>
        </header>
        <div id="thread-list" class="thread-list"></div>
      </aside>

      <main id="thread-pane" class="thread-pane">
        <div id="thread-empty" class="thread-empty">
          <span class="empty-emoji" aria-hidden="true">💬</span>
          <h2>No conversation open</h2>
          <p>Pick a conversation from the list, or start a new one.</p>
          <button
            class="btn btn-primary btn-pill"
            data-action="new-thread"
            type="button"
          >
            Start a conversation
          </button>
        </div>

        <div id="thread-view" class="thread-view hidden">
          <header class="thread-header">
            <button
              id="back-btn"
              class="btn btn-ghost back-btn"
              title="Back"
              aria-label="Back to conversations"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M15 5l-7 7 7 7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div id="member-chips" class="member-stack"></div>
            <div class="thread-header-main">
              <h2 id="thread-name" class="thread-name"></h2>
              <div id="thread-status" class="thread-status"></div>
            </div>
            <button
              id="pause-btn"
              class="btn btn-ghost btn-small btn-pill pause-btn"
            ></button>
          </header>
          <div id="messages" class="messages"></div>
          <div
            id="typing-indicator"
            class="typing-indicator hidden"
            aria-live="polite"
          ></div>
          <footer class="composer-wrap">
            <div id="paused-note" class="paused-note hidden">
              Paused — resume to keep talking.
            </div>
            <form id="composer" class="composer">
              <textarea
                id="composer-input"
                rows="1"
                aria-label="Message"
                placeholder="Say something&hellip;"
              ></textarea>
              <button
                type="submit"
                class="btn btn-primary send-btn"
                title="Send"
                aria-label="Send"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3.4 20.4l18.2-8.4L3.4 3.6l-.02 6.53L16 12 3.38 13.87z"
                    fill="currentColor"
                  />
                </svg>
              </button>
            </form>
          </footer>
        </div>
      </main>
    </div>

    <!-- Persona drawer -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
    <aside
      id="persona-drawer"
      class="persona-drawer hidden"
      aria-label="Philosopher details"
    >
      <header class="drawer-header">
        <div id="drawer-identity" class="drawer-identity"></div>
        <button
          id="drawer-close"
          class="btn btn-ghost"
          title="Close"
          aria-label="Close"
        >
          &times;
        </button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>

    <!-- New thread modal -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-label="New conversation"
      >
        <header class="modal-header">
          <h2>New conversation</h2>
          <button
            id="modal-close"
            class="btn btn-ghost"
            title="Close"
            aria-label="Close"
          >
            &times;
          </button>
        </header>
        <form id="new-thread-form" class="modal-body">
          <label class="field">
            <span class="field-label">Name</span>
            <input
              id="new-thread-name"
              type="text"
              maxlength="60"
              placeholder="The Symposium"
              required
            />
          </label>
          <div class="field">
            <span class="field-label"
              >Philosophers
              <span id="roster-count" class="field-hint"
                >(pick 1&ndash;6)</span
              ></span
            >
            <div id="roster-list" class="roster-list"></div>
          </div>
          <label class="field">
            <span class="field-label">Pace</span>
            <select id="new-thread-pace">
              <option value="relaxed" selected>Relaxed</option>
              <option value="chatty">Chatty</option>
            </select>
          </label>
          <p id="new-thread-error" class="form-error hidden"></p>
          <button type="submit" class="btn btn-primary btn-block btn-pill">
            Create conversation
          </button>
        </form>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
